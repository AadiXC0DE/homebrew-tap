# Every push and pull request is checked against Homebrew's own audit rules
# before a change is accepted. Nothing ships to a tap that fails audit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cask:
    name: Cask audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@master
      - name: Homebrew audit
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew audit --cask graphe
